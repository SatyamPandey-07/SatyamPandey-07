name: Waka Readme

on:
  schedule:
    # Runs at 12:00 AM IST (18:30 UTC) every day
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      crawl_commits:
        description: 'Crawl commits for Early Bird / Weekly graphs (takes ~15-25m). Uncheck for 15s quick update.'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Dev Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY || secrets.MAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_COMMIT: ${{ (github.event_name != 'workflow_dispatch' || inputs.crawl_commits) && 'True' || 'False' }}
          SHOW_DAYS_OF_WEEK: ${{ (github.event_name != 'workflow_dispatch' || inputs.crawl_commits) && 'True' || 'False' }}
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LOC_CHART: "False"
          SHOW_AI_CODING: "False"
          SHOW_AI_CODE_TIME: "False"
          MAX_REPOS: "25"
          COMMIT_BY_ME: "True"
          COMMIT_MESSAGE: "Updated with Dev Metrics [skip ci]"
